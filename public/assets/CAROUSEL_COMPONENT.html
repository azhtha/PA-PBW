<!-- 
    CAROUSEL COMPONENT - Reusable Carousel Template
    
    Usage: Copy this code into any page that needs a carousel
    Requirements: 
    - Include Swiper CDN and CSS
    - Include Tailwind CSS
    - Include Font Awesome icons
    - Include carousel.css
-->

<!-- Carousel Container -->
<div class="relative bg-gray-100 rounded-lg overflow-hidden shadow-lg">

    <!-- Swiper Carousel -->
    <div class="swiper carousel-swiper w-full h-[300px] md:h-[500px]">
        <div class="swiper-wrapper">
            <!-- Slide 1 -->
            <div class="swiper-slide">
                <img src="assets/hero.png" alt="Image 1" class="about-image">
            </div>
            <!-- Slide 2 -->
            <div class="swiper-slide">
                <img src="assets/Card1.png" alt="Image 2" class="about-image">
            </div>
            <!-- Slide 3 -->
            <div class="swiper-slide">
                <img src="assets/Card2.png" alt="Image 3" class="about-image">
            </div>
            <!-- Add more slides as needed -->
        </div>

        <!-- Navigation Arrows -->
        <div
            class="swiper-button-prev carousel-nav-btn absolute left-4 top-1/2 -translate-y-1/2 z-10 w-12 h-12 bg-white/80 hover:bg-white rounded-full flex items-center justify-center text-[#E88D57] cursor-pointer transition-all">
            <i class="fa-solid fa-chevron-left"></i>
        </div>
        <div
            class="swiper-button-next carousel-nav-btn absolute right-4 top-1/2 -translate-y-1/2 z-10 w-12 h-12 bg-white/80 hover:bg-white rounded-full flex items-center justify-center text-[#E88D57] cursor-pointer transition-all">
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <!-- Pagination Dots -->
        <div class="swiper-pagination absolute bottom-4 z-10 flex gap-2 justify-center w-full"></div>
    </div>

    <!-- Image Counter (Optional) -->
    <div class="absolute bottom-4 left-4 bg-black/60 px-4 py-2 rounded-full text-white text-sm z-10">
        <span class="carousel-counter">1</span> / 3
    </div>
</div>

<!-- JavaScript for Carousel -->
<script>
    const swiper = new Swiper('.carousel-swiper', {
        loop: true,
        autoplay: {
            delay: 5000,
            disableOnInteraction: false,
        },
        pagination: {
            el: '.swiper-pagination',
            clickable: true,
            renderBullet: function (index, className) {
                return '<span class="' + className + ' w-3 h-3 bg-white/60 hover:bg-white rounded-full cursor-pointer transition"></span>';
            },
        },
        navigation: {
            nextEl: '.swiper-button-next',
            prevEl: '.swiper-button-prev',
        },
        effect: 'fade',
        fadeEffect: {
            crossFade: true,
        },
        on: {
            slideChange: function () {
                document.querySelector('.carousel-counter').textContent = swiper.realIndex + 1;
            }
        }
    });
</script>

<!--
    CUSTOMIZATION GUIDE:
    
    1. Change images:
       - Replace 'assets/hero.png' with your image paths
       
    2. Change number of slides:
       - Add/remove <div class="swiper-slide"> blocks
       - Update the counter number in HTML (e.g., "/ 3" untuk 3 slides)
    
    3. Change auto-play delay:
       - Modify 'delay: 5000' (5000 = 5 seconds)
    
    4. Change carousel height:
       - Modify h-[300px] md:h-[500px] to desired height
       - Use Tailwind height classes: h-[100px], h-[400px], etc.
    
    5. Remove auto-play:
       - Delete the 'autoplay' object
    
    6. Remove pagination dots:
       - Remove the <div class="swiper-pagination"> element
    
    7. Remove counter:
       - Remove the "Image Counter" div
-->
